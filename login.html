<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AE-FUNAI Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page">
    <div class="login-left">
    <div class="logo-area">
        <img src="images/funai-logo.webp" alt="AE-FUNAI Logo">
        <h2>AE-FUNAI</h2>
    </div>
        <h1>"The beautiful thing about learning is that no one can take it away from you."</h1>
        <p>AE-FUNAI Digital Library - Access your textbooks from anywhere.</p>
    </div>

    <div class="login-right">
    <h2>Welcome back</h2>
    <p>Please enter your details to access the library.</p>
    <form action="books.html">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
        <label>Library Card Number</label>
        <input type="text" placeholder="e.g. FUNAI/LIB/2024/001" required>
        <label>Department</label>
        <input type="text" placeholder="e.g. Computer Science" required>
        <button type="submit" class="btn-dark">Login to Library</button>
    </form>
     <br>
        <p style="font-size: 13px; text-align: center;">Do you not have a Library Card? Visit the University Library to get one.</p>
    </div>
    </div>

</body>
</html>
